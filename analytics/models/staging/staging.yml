models:
  - name: stg_job_postings
    description: >
      One row per posting per scrape day - a job re-scraped across days keeps
      every row. 691,950 rows after the door-drop (the scraper's own error flag).
    columns:
      - name: job_id
        description: The scraper's posting id. Not unique at this grain - one row per posting per scrape day.
      - name: search_term
        description: The role the scraper searched for; three values by construction.
      - name: search_date
        description: Scrape day.
      - name: searched_at
        description: Scrape timestamp (search_time renamed).
      - name: search_location
        description: Location parameter the scraper searched under.
      - name: job_title
        description: Posting title as scraped.
      - name: company_name
        description: Employer name, trimmed.
      - name: job_location
        description: Posting location as scraped.
      - name: source_platform
        description: Posting source platform, scraped as 'via <platform>' and trimmed to just the
      - name: job_schedule_type
        description: As scraped; 12,252 nulls stay null - documented, not fixed.
      - name: job_work_from_home
        description: True when the posting is flagged remote.
      - name: job_posted_at
        description: Raw relative posted time ('10 hours ago'), kept unparsed - search_date carries the time axis; parsing it is a supporter exercise.
      - name: job_salary
        description: Raw salary text, unparsed for now.
      - name: salary_min
        description: Lower bound of salary range, parsed from job_salary.
      - name: salary_max
        description: Upper bound of salary range, parsed from job_salary.
      - name: avg_salary
        description: Average of salary_min and salary_max, parsed from job_salary.
      - name: salary_period
        description: Pay period, parsed from job_salary.
      - name: salary_currency
        description: Currency marker, parsed from job_salary.
      - name: has_health_insurance
        description: Posting list health insurance
      - name: has_dental_insurance
        description: Posting list dental insurance
      - name: has_paid_time_off
        description: Posting list paid time off
      - name: has_no_degree_mentioned
        description: Posting list no degree mentioned
  - name: stg_job_skills
    description: >
      One row per (job_id, skill_keyword), straight off the raw table.
      A skill_id repeats on a job when the posting names it two ways (spark, pyspark).
      Deliberately boring; rename, order, trim is the discipline working.
    columns:
      - name: job_id
        description: Every row's parent exists in stg_job_postings - the export's join guarantees it.
      - name: skill_id
        description: Skill key; the human-readable text rides in skill_keyword.
      - name: skill_keyword
        description: Skill text as extracted, trimmed.
